title = "TRAK-Based Data Selection for CTR Prediction"
subtitle = "Data Attribution & Model Efficiency"
date = "2025 - Present"
content = """
Research project applying data attribution methods to optimize training efficiency:
- Implemented ghost inner-product approximation for computational optimization
- Reduced TRAK runtime from 10× to 2× of baseline training time
- Achieved equivalent model performance using only 85% of selected training data
- Outperformed random selection across all metrics on YouTube CTR prediction task
"""
tags = ["Data Attribution", "ML Efficiency", "Research"]

