<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal Subtitle Translation</title>
  <desc id="desc">Four-stage multimodal subtitle translation pipeline with duration-aware TTS feedback.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8eef5" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#203b61"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bd8126"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#18365f;letter-spacing:.3px}
      .eyebrow{font:700 13px Arial,sans-serif;fill:#68809c;letter-spacing:2.4px}
      .moduleTitle{font:700 20px Arial,sans-serif;fill:#203b61}
      .body{font:400 15px Arial,sans-serif;fill:#536b84}
      .tag{font:700 13px Arial,sans-serif;fill:#18365f;letter-spacing:1px}
      .small{font:400 13px Arial,sans-serif;fill:#667b91}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#fff"/><rect width="1600" height="820" fill="url(#grid)" opacity=".55"/>
  <text x="800" y="62" text-anchor="middle" class="title">MULTIMODAL SUBTITLE TRANSLATION</text>
  <text x="800" y="92" text-anchor="middle" class="eyebrow">UNDERSTAND  ·  TRANSLATE  ·  SPEAK</text>

  <!-- inputs -->
  <g transform="translate(40 235)"><rect width="180" height="112" rx="12" fill="#f7fafc" stroke="#8da5bd" stroke-width="2"/><text x="90" y="34" text-anchor="middle" class="moduleTitle">VIDEO</text><rect x="36" y="52" width="108" height="38" rx="6" fill="#e5edf5"/><path d="M84 61l16 10-16 10z" fill="#68809c"/></g>
  <g transform="translate(40 385)"><rect width="180" height="112" rx="12" fill="#f7fafc" stroke="#8da5bd" stroke-width="2"/><text x="90" y="34" text-anchor="middle" class="moduleTitle">SUBTITLES</text><path d="M62 58h56M62 70h56M62 82h38" stroke="#68809c" stroke-width="5" stroke-linecap="round"/></g>

  <!-- modules -->
  <g transform="translate(270 180)"><rect width="275" height="330" rx="16" fill="#edf4fb" stroke="#4f81b8" stroke-width="2"/><circle cx="32" cy="0" r="22" fill="#4f81b8"/><text x="32" y="7" text-anchor="middle" font="700 16px Arial" fill="#fff">A</text><text x="137" y="58" text-anchor="middle" class="moduleTitle">GLOBAL CONTEXT</text><text x="137" y="92" text-anchor="middle" class="body">VLM watches the full video</text><text x="137" y="114" text-anchor="middle" class="body">and infers story, characters,</text><text x="137" y="136" text-anchor="middle" class="body">and speaker identity.</text><rect x="34" y="172" width="207" height="78" rx="10" fill="#fff" stroke="#b6cbe0"/><circle cx="78" cy="210" r="18" fill="#dbe9f5"/><circle cx="137" cy="210" r="18" fill="#dbe9f5"/><circle cx="196" cy="210" r="18" fill="#dbe9f5"/><path d="M68 210h20M127 210h20M186 210h20" stroke="#4f81b8" stroke-width="2"/><text x="137" y="275" text-anchor="middle" class="small">story · characters · speakers</text><rect x="25" y="292" width="225" height="28" rx="8" fill="#d6e7f6"/><text x="137" y="311" text-anchor="middle" class="tag">SPEAKER ATTRIBUTION</text></g>

  <g transform="translate(595 180)"><rect width="275" height="330" rx="16" fill="#f3f1fa" stroke="#8b8fc9" stroke-width="2"/><circle cx="32" cy="0" r="22" fill="#8b8fc9"/><text x="32" y="7" text-anchor="middle" font="700 16px Arial" fill="#fff">B</text><text x="137" y="58" text-anchor="middle" class="moduleTitle">SCENE GROUNDING</text><text x="137" y="92" text-anchor="middle" class="body">Detect shots and analyze scenes</text><text x="137" y="114" text-anchor="middle" class="body">to align visual actions with</text><text x="137" y="136" text-anchor="middle" class="body">subtitle time spans.</text><rect x="32" y="172" width="211" height="78" rx="10" fill="#fff" stroke="#c9c7e3"/><path d="M48 220h180M80 188v48M142 188v48M204 188v48" stroke="#8b8fc9" stroke-width="2"/><circle cx="80" cy="210" r="8" fill="#8b8fc9"/><circle cx="142" cy="210" r="8" fill="#8b8fc9"/><circle cx="204" cy="210" r="8" fill="#8b8fc9"/><text x="137" y="275" text-anchor="middle" class="small">shots · actions · time alignment</text><rect x="25" y="292" width="225" height="28" rx="8" fill="#e3e0f4"/><text x="137" y="311" text-anchor="middle" class="tag">MULTIMODAL ALIGNMENT</text></g>

  <g transform="translate(920 180)"><rect width="275" height="330" rx="16" fill="#f3f1fa" stroke="#8b8fc9" stroke-width="2"/><circle cx="32" cy="0" r="22" fill="#8b8fc9"/><text x="32" y="7" text-anchor="middle" font="700 16px Arial" fill="#fff">C</text><text x="137" y="58" text-anchor="middle" class="moduleTitle">INLINE-TAG TRANSLATION</text><text x="137" y="92" text-anchor="middle" class="body">Inject visual and textual</text><text x="137" y="114" text-anchor="middle" class="body">annotations into a context-aware</text><text x="137" y="136" text-anchor="middle" class="body">batch translation prompt.</text><rect x="30" y="172" width="215" height="78" rx="10" fill="#fff" stroke="#c9c7e3"/><text x="48" y="202" class="small">[SCENE=2] [SPK=Anna]</text><text x="48" y="224" class="small">[VIS=coffee_shop]</text><text x="48" y="246" class="small">Translated subtitle …</text><rect x="25" y="292" width="225" height="28" rx="8" fill="#e3e0f4"/><text x="137" y="311" text-anchor="middle" class="tag">INLINE TAGS</text></g>

  <g transform="translate(1245 180)"><rect width="275" height="330" rx="16" fill="#edf4fb" stroke="#4f81b8" stroke-width="2"/><circle cx="32" cy="0" r="22" fill="#4f81b8"/><text x="32" y="7" text-anchor="middle" font="700 16px Arial" fill="#fff">D</text><text x="137" y="52" text-anchor="middle" class="moduleTitle">DURATION-AWARE</text><text x="137" y="77" text-anchor="middle" class="moduleTitle">TTS AGENT</text><text x="137" y="112" text-anchor="middle" class="body">Check speech duration against</text><text x="137" y="134" text-anchor="middle" class="body">the original subtitle window;</text><text x="137" y="156" text-anchor="middle" class="body">revise when it does not fit.</text><rect x="40" y="185" width="195" height="52" rx="10" fill="#fff" stroke="#b6cbe0"/><text x="137" y="207" text-anchor="middle" class="small">TTS duration  3.2 s</text><text x="137" y="226" text-anchor="middle" class="small">subtitle window  2.5 s</text><rect x="25" y="292" width="225" height="28" rx="8" fill="#d6e7f6"/><text x="137" y="311" text-anchor="middle" class="tag">CLOSED-LOOP CONTROL</text></g>

  <!-- arrows -->
  <path d="M220 291H270" stroke="#203b61" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M220 441H270" stroke="#203b61" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M545 345H595" stroke="#203b61" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870 345H920" stroke="#203b61" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1195 345H1245" stroke="#203b61" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1380 515C1380 620 1050 650 1050 515" fill="none" stroke="#bd8126" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#amberArrow)"/><text x="1215" y="626" text-anchor="middle" font="600 14px Arial" fill="#bd8126">revise if duration exceeds window</text>
  <g transform="translate(270 700)"><text class="eyebrow">CORE CONTRIBUTIONS</text><text x="0" y="32" class="small">Global video context  ·  scene-level grounding  ·  inline-tag conditioning  ·  duration-aware feedback</text></g>
</svg>
